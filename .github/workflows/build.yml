name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Codename'
        required: true
        default: 'alioth'
        type: choice
        options:
          - psyche
          - thyme
          - umi
          - munch
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa

      script:
        description: 'Select Build Script'
        required: true
        default: 'build-miui.sh'
        type: choice
        options:
          - build.sh
          - build-miui.sh

      ksu:
        description: 'Enable KernelSU (ReSukiSU-SuSFS)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Kernel for ${{ inputs.device }} (${{ inputs.script }}) (${{ inputs.ksu && 'KSU' || 'NoKSU' }})
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. SETUP LATEST SUKISU ULTRA (Naya Update)
      # ============================================================
      - name: Setup SukiSU Ultra Drivers
        if: ${{ inputs.ksu }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

      # ============================================================
      # 3. CLEAN DISK
      # ============================================================
      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "Free space:"
          df -h

      # ============================================================
      # 4. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            bison \
            flex \
            zip \
            unzip \
            bc \
            cpio \
            libssl-dev \
            ccache \
            python-is-python3 \
            jq
          echo "Dependencies installed."

      # ============================================================
      # 5. SETUP CCACHE
      # ============================================================
      - name: Setup Cache (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache_mikernel
          key: kernel-ccache-${{ inputs.device }}-${{ inputs.script }}-${{ github.run_id }}
          restore-keys: |
            kernel-ccache-${{ inputs.device }}-${{ inputs.script }}-
            kernel-ccache-${{ inputs.device }}-
            kernel-ccache-

      # ============================================================
      # 6. SETUP TOOLCHAIN
      # ============================================================
      - name: Setup Toolchain (ZyC-Clang 15)
        run: |
          mkdir -p "$HOME/zyc-clang"
          cd "$HOME/zyc-clang"
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260208-release/Clang-15.0.7-20260208.tar.gz
          tar -zxvf Clang-15.0.7-20260208.tar.gz
          echo "ZyC-Clang installed."
          ls -lah "$HOME/zyc-clang"

      # ============================================================
      # 7. RUN BUILD SCRIPT
      # ============================================================
      - name: Build Kernel
        run: |
          chmod +x ${{ inputs.script }}
          ./${{ inputs.script }} ${{ inputs.device }}
